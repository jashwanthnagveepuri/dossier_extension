<!doctype html><html><body>
<!-- Modeled on Lever's apply page: .application-question cards, name="name", urls[...], radio cards, EEO selects. -->
<form id="application-form" action="/apply" onsubmit="event.preventDefault(); document.body.innerHTML='<h3>Application submitted!</h3>'">
  <ul>
    <li class="application-question"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
      <div class="application-field"><input id="resume-upload-input" type="file" name="resume" style="opacity:0;width:1px;height:1px"></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
      <div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
      <div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div>
      <div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div>
      <div class="application-field"><input type="text" name="org"></div></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
      <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div>
      <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
    <li class="application-question"><label><div class="application-label">Portfolio URL</div>
      <div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
  </ul>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Are you willing to relocate?<span class="required">✱</span></div></div>
    <div class="application-field"><ul>
      <li><label><input type="radio" name="cards[abc][field0]" value="Yes" required> Yes</label></li>
      <li><label><input type="radio" name="cards[abc][field0]" value="No"> No</label></li>
    </ul></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Why are you interested in this role?<span class="required">✱</span></div></div>
    <div class="application-field"><textarea name="cards[abc][field1]" required></textarea></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Do you have at least five years experience?</div></div>
    <div class="application-field"><select name="cards[abc][field2]"><option value="">Select ...</option><option>Yes</option><option>No</option></select></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Anything else you'd like us to know?</div></div>
    <div class="application-field"><textarea name="cards[abc][field3]"></textarea></div>
  </div>
  <div class="application-question"><div class="application-label">Gender</div>
    <select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
  <div class="application-question"><div class="application-label">Race</div>
    <select name="eeo[race]"><option value="">Select ...</option><option>Hispanic or Latino</option><option>White (Not Hispanic or Latino)</option><option>Asian (Not Hispanic or Latino)</option><option>Decline to self-identify</option></select></div>
  <div class="application-question"><div class="application-label">Veteran status</div>
    <select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
</body></html>
