name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check-private   # secret formats in the whole history (personal terms are checked on your own machine)
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm test
